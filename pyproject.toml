[project]
name = "adapted-reasoning-rag"
version = "0.1.0"
description = "Bilingual, voice-enabled RAG assistant with claim-level evidence sufficiency checking for Indian government welfare scheme eligibility."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Krish Yadav"},
    {name = "Pranjal Seluriyal"},
    {name = "Isha"},
]

dependencies = [
    # --- Foundation (Phase 0) ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # --- Phase 1: Ingestion (current) ---
    "pymupdf>=1.24.0",

    # --- Phase 1: Retrieval — to be added ---
    #   "chromadb", "sentence-transformers", "rank-bm25"
    # --- Phase 2: Reasoning & Eligibility — to be added ---
    #   "langchain", "pyyaml"
    # --- Phase 3: Voice & Frontend — to be added ---
    #   "openai-whisper", "TTS"
    # --- Phase 4: Evaluation — to be added ---
    #   "ragas", "datasets"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
